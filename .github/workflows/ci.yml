# CI: PR과 main 푸시마다 테스트 -> 이미지 빌드(amd64, arm64) -> 취약점 스캔을 돌리고, main 푸시일 때만 GHCR에 멀티 아키텍처 이미지를 올린다.
# 이미지를 올린 뒤에는 deploy-dev 잡이 설정 저장소(GitOps)의 dev 이미지 태그를 그 커밋 SHA로 바꿔 커밋한다. 클러스터에 배포하는 일은 CI가 아니라 클러스터 안의 Argo CD가 한다.
#
# 잡 표시 이름(test, image)은 브랜치 룰셋이 필수 상태 검사로 지정한 이름이라 바꾸면 안 된다.
# 같은 이유로 paths 필터도 두지 않는다. 필터로 워크플로가 건너뛰어지면 그 검사는 "Pending"으로 남고,
# 필수 검사를 요구하는 PR은 머지할 수 없게 된다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 기본 권한은 contents 읽기뿐이다 (permissions에 적지 않은 권한은 모두 none이 된다).
# 더 필요한 잡은 그 잡에서만 올린다 (아래 image 잡). 서드파티 액션이나 빌드 스크립트(PR 코드 포함)가
# 악성으로 바뀌어도 토큰으로 할 수 있는 일이 저장소 읽기로 제한된다.
permissions:
  contents: read

# 같은 ref(브랜치 또는 PR)에서 새 실행이 시작되면 이전 실행을 취소한다. 취소는 PR에서만 한다.
# main에서는 진행 중인 실행을 끊지 않는다. 이미지 푸시 도중에 끊기지 않고 끝까지 돌게 하려는 것이다.
# (대기 중인 실행은 더 새 실행이 오면 GitHub가 대체한다)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    # ubuntu-latest는 GitHub가 가리키는 이미지를 새 LTS로 옮기면 워크플로를 고치지 않아도 환경이 바뀐다.
    # 버전을 고정해 빌드 환경을 예측 가능하게 둔다.
    runs-on: ubuntu-24.04
    # 기본 타임아웃은 360분이다. 멈춘 잡(예: 이미지 풀 대기)이 러너를 6시간 붙잡지 않게 상한을 둔다.
    timeout-minutes: 20
    steps:
      # 이 파일의 액션은 (GitHub이 만든 것도 포함해) 모두 태그(v4 등)가 아니라 전체 커밋 SHA로 고정하고, 뒤에 버전을 주석으로 남긴다.
      # 태그는 저장소 소유자(또는 계정을 탈취한 공격자)가 다른 커밋으로 옮길 수 있는 이름이라, 태그로 참조하면 그 시점의 코드가 그대로 실행된다.
      # 실제로 2026-03-19에 aquasecurity/trivy-action의 버전 태그 76개가 악성 커밋으로 강제 푸시돼, 태그로 참조한 워크플로가
      # 러너의 비밀을 훔치는 코드를 실행했다 (GHSA-69fq-xp46-6x23). 안전한 커밋 SHA에 고정해 둔 워크플로는 영향이 없었다.
      # 커밋 SHA는 내용의 해시라서 가리키는 코드가 바뀔 수 없다. 주석의 버전은 사람이 읽으라고 남긴 것이고,
      # Dependabot이 SHA와 주석을 함께 올려 준다 (dependabot.yml 참고).
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 체크아웃에 쓴 토큰을 러너에 남기지 않는다. 이 잡은 git push 같은 인증된 git 작업을 하지 않으므로(푸시하는 deploy-dev 잡만 예외다),
          # 남겨 두면 뒤따르는 단계(서드파티 액션, 빌드 스크립트)가 그 토큰을 읽어 갈 수 있는 여지만 생긴다.
          persist-credentials: false

      # 빌드가 요구하는 JDK 25(toolchain)를 JAVA_HOME으로 잡는다. Gradle은 JAVA_HOME 같은 로컬 JDK를 먼저 탐지하고, 요구에 맞는 JDK를
      # 못 찾을 때만 자동으로 내려받는다 (settings.gradle.kts의 foojay 리졸버). 그래서 미리 잡아 두면 다운로드 없이 그 JDK를 쓴다.
      - name: JDK 25 설치
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # setup-gradle이 해 주는 일 두 가지.
      # 1) 의존성 캐시: Gradle 사용자 홈(내려받은 의존성, 래퍼 배포본 등)을 Actions 캐시에 저장하고 복원한다.
      #    캐시는 기본 브랜치(main)에서만 쓰고 PR은 읽기만 한다.
      # 2) 래퍼 검증: 저장소의 모든 gradle-wrapper.jar의 SHA-256을 Gradle 공식 릴리스 체크섬과 대조하고, 모르는 jar면 실패한다.
      #    gradle-wrapper.jar는 커밋된 바이너리를 ./gradlew가 그대로 실행하는 구조라서, 변조된 jar가 PR로 들어오면 CI 러너에서 임의 코드가 돈다.
      # (v6의 기본 캐시 구현은 Gradle의 독점 라이브러리이고 공개 저장소에서는 무료다. MIT 구현을 쓰려면 cache-provider: basic)
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Testcontainers가 PostgreSQL·Redis 컨테이너를 러너에 설치된 Docker로 직접 띄우므로 services: 정의가 필요 없다.
      - name: 테스트 실행
        run: ./gradlew test

      # 실패했을 때만 HTML 리포트를 남긴다. 러너는 잡이 끝나면 사라지므로, 올리지 않으면 실패 원인을 로그에서만 찾아야 한다.
      # 아티팩트 이름은 한 run 안에서 유일해야 하고 v4 이후 아티팩트는 한 번 만들면 바뀌지 않는다(immutable).
      # 재실행(re-run)은 같은 run에서 시도 번호만 올라가므로, 시도 번호를 이름에 붙여 재실행에서 이름이 겹치지 않게 한다.
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ github.run_attempt }}
          path: build/reports/tests/test

  image:
    name: image
    # 테스트를 통과한 코드만 이미지로 만든다. 깨진 코드를 빌드·스캔하느라 러너 시간을 쓰지 않는다.
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 잡 단위 permissions는 워크플로 단위 값에 더해지는 게 아니라 그것을 통째로 대체한다. 그래서 contents: read를 다시 적는다.
    # 쓰기 권한은 필요한 이 잡에만 준다: packages: write(GHCR에 이미지 푸시), security-events: write(SARIF를 code scanning에 업로드).
    # 권한은 잡 단위로만 나눌 수 있어서 PR 실행의 토큰에도 packages: write가 실리지만(포크 PR은 GitHub가 읽기로 낮춘다),
    # 이를 쓰는 로그인·푸시 단계는 main 푸시에서만 실행한다.
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # test 잡과 같은 이유

      # 러너(amd64)에서 arm64 이미지를 만들려면 QEMU 에뮬레이션이 필요하다. 이 액션은 QEMU 에뮬레이터를 커널의 binfmt_misc에 등록해서(tonistiigi/binfmt 이미지를 --privileged로 실행한다),
      # 러너가 arm64 바이너리를 만나면 에뮬레이터를 거쳐 실행하게 한다. 그래야 BuildKit이 arm64 이미지 안에서 RUN 명령을 돌릴 수 있다.
      # 에뮬레이션이 필요한 곳은 Dockerfile 실행 스테이지의 RUN groupadd/useradd 하나뿐이다. Gradle을 돌리는 빌드 스테이지는 FROM --platform=$BUILDPLATFORM 덕분에
      # 러너의 네이티브 CPU(amd64)에서 한 번만 돌고, COPY 같은 나머지 단계는 프로세스를 실행하지 않는다. 에뮬레이션은 몇 배 느리지만 이 RUN은 짧게 끝난다.
      # platforms: arm64: 러너가 amd64라서 amd64 에뮬레이터는 필요 없다. 기본값(all)은 쓰지 않는 아키텍처의 핸들러까지 전부 등록한다.
      # 이 액션의 문서가 Buildx 설정보다 먼저 실행하라고 안내해서 그 앞에 둔다.
      - name: QEMU 설정 (arm64 에뮬레이션)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # gha 캐시 백엔드와 멀티 플랫폼 빌드는 기본 docker 드라이버로는 쓸 수 없다(containerd 이미지 스토어를 켠 경우만 예외).
      # 이 액션이 BuildKit 컨테이너를 쓰는 docker-container 드라이버 빌더를 만들어 준다.
      - name: Buildx 설정
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 이미지 이름은 ghcr.io/<소유자>/<저장소>(metadata-action이 소문자로 바꿔 준다), 태그는 커밋 전체 SHA(40자) 하나이고 접두사도 없다.
      # latest 태그는 만들지 않는다. latest는 시점마다 다른 이미지를 가리키는 움직이는 이름이라 "지금 뭐가 떠 있나", "어디로 되돌리나"에 답할 수 없다.
      # SHA 태그는 이미지를 소스 커밋과 1:1로 묶어서, 나중에 GitOps 배포 매니페스트가 정확히 이 빌드를 가리키게 해 준다.
      # 이 태그 하나가 amd64와 arm64 이미지를 묶은 인덱스(멀티 아키텍처 이미지)를 가리켜서, 노드의 컨테이너 런타임이 자기 CPU에 맞는 쪽을 알아서 받아 간다.
      # 그래서 배포 매니페스트가 플랫폼별 태그를 따로 알 필요가 없다.
      # flavor: latest=false는 명시적인 잠금이다. type=sha만 쓰면 latest가 안 생기지만(기본값 auto에서는 type=semver,
      # type=ref,event=tag 같은 규칙에서 생긴다), 나중에 태그 규칙을 더해도 latest가 슬쩍 붙지 않게 한다.
      # 라벨(OCI)에는 이 이미지가 어느 저장소·커밋에서 나왔는지가 남는다. GHCR은 org.opencontainers.image.source 라벨로 패키지를 저장소에 연결한다.
      - name: 이미지 이름·태그·라벨 계산
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long,prefix=
          flavor: latest=false

      # 순서가 핵심이다: 빌드(로컬 도커에만 적재) -> 스캔 -> 통과했을 때만 푸시.
      # 푸시를 먼저 하면 게이트가 실패해도 그 SHA 태그의 이미지는 이미 레지스트리에 남아, 나중에 배포 매니페스트가 그 SHA를 가리키는 순간
      # 취약한 이미지가 그대로 배포된다. 그래서 여기서는 push하지 않고 load로 러너의 도커에만 적재하고, 스캔도 그 로컬 이미지를 읽는다.
      #
      # 플랫폼마다 따로 빌드해서 적재한다. Trivy는 이미지 하나(= 한 플랫폼)씩 스캔하는데, 두 플랫폼을 한 번에 빌드한 결과는 이미지들을 묶은 인덱스라서
      # containerd 이미지 스토어를 켜지 않은 도커(지금 러너가 그렇다)에는 적재할 수 없다. 그래서 스캔할 이미지를 플랫폼별로 따로 만든다.
      # scan:amd64와 scan:arm64는 이 러너의 도커에서만 쓰는 이름이라 레지스트리에는 올라가지 않는다(진짜 태그는 아래 푸시 단계가 붙인다).
      # 두 빌드는 같은 빌더의 내부 캐시를 공유한다. Gradle을 돌리는 빌드 스테이지는 Dockerfile의 FROM --platform=$BUILDPLATFORM 덕분에
      # 타깃 플랫폼과 무관하게 똑같은 단계라서, 먼저 도는 amd64 빌드가 끝낸 결과를 arm64 빌드가 그대로 재사용한다(빌드 로그에 CACHED로 나온다).
      # 그래서 Gradle은 두 빌드를 합쳐서 한 번만 돈다.
      #
      # context: .를 명시한다. build-push-action의 기본 컨텍스트는 Git 컨텍스트(BuildKit이 저장소를 직접 클론)라서,
      # 위에서 체크아웃한 작업 디렉터리를 쓰려면 지정해야 한다.
      # GIT_COMMIT 빌드 인자는 Dockerfile을 거쳐 /actuator/info의 commit이 된다. 지금 떠 있는 앱이 어느 커밋인지 확인하려는 것이다.
      #
      # gha 캐시는 scope(캐시 묶음의 이름)를 정하지 않으면 모든 빌드가 같은 이름(buildkit)을 쓰고, 나중에 캐시를 내보낸 빌드가 앞의 캐시를 덮어써서 마지막 것만 남는다.
      # 두 빌드가 그렇게 하면 arm64 빌드가 amd64 빌드의 캐시를 지우므로, cache-to는 플랫폼마다 scope를 나눠 쓰고(amd64, arm64) cache-from은 둘 다 읽는다.
      # 빌드 스테이지의 캐시는 두 scope에 다 들어 있고, 플랫폼별로 따로 만드는 실행 스테이지의 캐시는 그 플랫폼의 scope에만 들어 있다.
      # cache-to의 mode=max: 멀티스테이지 빌드의 중간 스테이지(Gradle 빌드) 레이어까지 캐시한다.
      # 기본값 min은 최종 이미지에 들어가는 레이어만 저장해서 빌드 스테이지가 매번 처음부터 돈다.
      - name: 이미지 빌드 (amd64, 로컬 도커에 적재)
        id: build-amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: scan:amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: type=gha,scope=amd64,mode=max

      # 위 amd64 빌드와 인자가 같고 플랫폼, 태그, cache-to의 scope만 다르다.
      # 러너의 CPU(amd64)와 다른 타깃이라서 이 빌드의 실행 스테이지 RUN groupadd/useradd가 QEMU 위에서 돈다(위 QEMU 설정 단계).
      - name: 이미지 빌드 (arm64, 로컬 도커에 적재)
        id: build-arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: scan:arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      # 취약점 스캔은 로컬에 적재한 두 이미지(amd64, arm64) 각각에 두 번씩, 모두 네 번 돈다 (trivy는 한 번의 실행에 출력 형식을 하나만 낼 수 있다).
      #   1) SARIF: GitHub code scanning(Security 탭)에 올릴 결과. exit-code 0이라 여기서는 실패하지 않는다.
      #   2) table: 로그에 사람이 읽는 표로 남기고, 기준을 어기면 잡을 실패시키는 게이트.
      # 두 플랫폼을 다 스캔하는 이유: 두 이미지가 같은 jar를 담아도 실행 스테이지의 OS 패키지는 CPU마다 따로 빌드된 것이라 판정이 어긋날 수 있다.
      # 정책은 네 번 모두 같다: CRITICAL·HIGH만, 그리고 패치가 이미 나온 것만(ignore-unfixed).
      # 패치가 없는 취약점은 우리가 고칠 수단이 없어서(베이스 이미지가 갱신되길 기다려야 한다) 빌드를 막아 봐야 소용이 없다.
      # trivy-action은 SARIF 형식이면 severity 입력을 무시하고 모든 등급을 담는다.
      # limit-severities-for-sarif로 같은 정책을 강제해서 Security 탭과 게이트의 결과가 어긋나지 않게 한다.
      #
      # 취약점 DB는 네 실행이 같은 걸 쓴다. 첫 실행(amd64 SARIF)이 받거나 Actions 캐시에서 복원해 cache-dir에 두고, 나머지 세 실행은 다운로드를 건너뛴다
      # (skip-setup-trivy로 설치도, TRIVY_SKIP_*로 DB 갱신도 생략). 매번 새로 받으면 시간이 들고 DB 배포처의 rate limit에 걸려
      # 스캔이 실패할 수 있다 (trivy-action README도 이 때문에 캐시를 켜 두라고 권한다). 네 실행이 같은 DB로 판정하는 효과도 있다.
      # cache-dir과 SARIF 파일은 작업 디렉터리 밖(runner.temp)에 둔다. cache-dir 기본값은 $GITHUB_WORKSPACE/.cache/trivy인데,
      # 작업 디렉터리에 파일이 생기면 아래 푸시용 빌드의 컨텍스트가 스캔한 이미지를 만든 두 빌드와 달라진다. Dockerfile이 작업 디렉터리를 통째로 COPY하면
      # 그 레이어의 캐시가 깨져서, 스캔한 것과 다른 결과물을 새로 빌드해 올리게 된다.
      - name: Trivy 스캔 (amd64, SARIF)
        id: trivy-sarif-amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan:amd64
          format: sarif
          output: ${{ runner.temp }}/trivy-amd64.sarif
          limit-severities-for-sarif: true
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache-dir: ${{ runner.temp }}/trivy-cache

      # arm64 이미지도 같은 정책으로 스캔한다. 설치와 DB는 위 amd64 스캔이 준비해 둔 것을 쓴다(아래 게이트 둘도 같다).
      # 첫 실행이 이미 cache-dir에 DB를 받아 뒀으므로 Actions 캐시 복원·저장을 여기서 또 하지 않는다(cache: false).
      - name: Trivy 스캔 (arm64, SARIF)
        id: trivy-sarif-arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan:arm64
          format: sarif
          output: ${{ runner.temp }}/trivy-arm64.sarif
          limit-severities-for-sarif: true
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache-dir: ${{ runner.temp }}/trivy-cache
          skip-setup-trivy: true
          cache: false
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true

      # 게이트는 SARIF 스캔 둘이 끝난 뒤에 돌린다. 한쪽 게이트가 실패해도 두 플랫폼의 SARIF가 이미 만들어져 있어서 아래 업로드가 둘 다 올릴 수 있다.
      - name: Trivy 게이트 (amd64, 패치 가능한 CRITICAL·HIGH가 있으면 실패)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan:amd64
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache-dir: ${{ runner.temp }}/trivy-cache
          skip-setup-trivy: true
          cache: false
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true

      # amd64 게이트가 실패해도 arm64 게이트는 돌려서, 한 번의 실행에서 두 플랫폼의 결과를 다 본다.
      # !cancelled(): 앞 단계가 실패했어도 실행하고, 취소된 실행에서는 돌지 않는다. arm64 SARIF 스캔이 성공했을 때만 실행한다(이미지와 취약점 DB가 준비됐다는 뜻이다).
      # 그래도 잡은 실패로 끝난다. 아래 로그인·푸시 단계는 앞 단계가 하나라도 실패하면 실행되지 않는다.
      - name: Trivy 게이트 (arm64, 패치 가능한 CRITICAL·HIGH가 있으면 실패)
        if: ${{ !cancelled() && steps.trivy-sarif-arm64.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan:arm64
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache-dir: ${{ runner.temp }}/trivy-cache
          skip-setup-trivy: true
          cache: false
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true

      # always(): 게이트가 실패해도 결과는 올린다. 실패한 실행일수록 Security 탭에서 원인을 봐야 하기 때문이다.
      # 다만 SARIF 파일을 만든 스캔이 성공했을 때만 실행한다 (빌드가 실패해 파일이 없을 때 '파일 없음' 오류가 진짜 원인을 가리지 않게).
      # dependabot[bot] 실행(github.actor 기준)은 건너뛴다. 이런 실행의 GITHUB_TOKEN은 기본이 읽기 전용이라 security-events: write를
      # 받지 못하는 경우가 있고, 그러면 code scanning 업로드가 403 "Resource not accessible by integration"으로 실패한다
      # (GitHub의 code scanning 문제 해결 문서가 Dependabot 실행에서 안내하는 오류다).
      # 결과 보고용 단계 하나 때문에 잡 전체가 빨개지지 않게 이 단계만 건너뛴다. 스캔과 게이트는 Dependabot 실행에서도 그대로 돈다.
      #
      # category: 같은 커밋에서 같은 도구(Trivy)의 SARIF를 둘 올리므로 플랫폼마다 category를 달리 줘야 한다. GitHub 문서에 따르면 같은 커밋에
      # 같은 category, 같은 도구로 두 번째를 올리면 앞의 결과가 덮어써지고, 한 워크플로 실행 안에서 그렇게 올리면 설정 오류로 감지돼 실행이 실패한다.
      # category가 다르면 code scanning이 두 결과를 각각 따로 보관한다.
      - name: Trivy 결과를 code scanning에 업로드 (amd64)
        if: always() && steps.trivy-sarif-amd64.outcome == 'success' && github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/trivy-amd64.sarif
          category: trivy-linux-amd64

      - name: Trivy 결과를 code scanning에 업로드 (arm64)
        if: always() && steps.trivy-sarif-arm64.outcome == 'success' && github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/trivy-arm64.sarif
          category: trivy-linux-arm64

      # 여기부터는 main 푸시에서만 실행한다 (앞 단계가 모두 성공해야 도달한다: 스캔 게이트를 통과한 이미지만 올라간다).
      - name: GHCR 로그인
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 같은 태그·라벨·빌드 인자로 다시 빌드하되, 이번에는 두 플랫폼을 한 번에 만들어(platforms) push: true로 올린다.
      # 위 두 빌드가 같은 빌더에 남긴 캐시(빌더의 내부 캐시와 gha 캐시)를 그대로 써서 레이어를 다시 만들지 않는다.
      # Gradle도, QEMU 위에서 도는 RUN groupadd/useradd도 다시 돌지 않으므로 스캔한 것과 같은 레이어가 올라간다.
      # 새로 만드는 것은 플랫폼별 이미지 매니페스트와 설정, provenance 증명, 그리고 이것들을 묶는 인덱스뿐이다.
      # 그래서 SHA 태그는 amd64와 arm64를 함께 가리키는 멀티 아키텍처 인덱스가 된다. cache-to는 다시 쓰지 않는다 (위 두 빌드가 scope별로 이미 내보냈다).
      # 다만 매니페스트 다이제스트까지 같지는 않다. 푸시 결과에는 provenance 증명이 붙고(공개 저장소라 기본이 mode=max),
      # 이미지 config의 생성 시각도 새로 찍힌다. 공개 저장소의 기본 provenance에는 build-args 값이 그대로 담기므로
      # 비밀값은 build-args로 넘기면 안 된다 (GIT_COMMIT은 공개 정보라 괜찮다).
      - name: 멀티 아키텍처 이미지 푸시 (amd64 + arm64)
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

      # 이미지 크기와 푸시한 태그를 실행 요약에 남긴다. 1단계에서 멀티스테이지로 바꾼 이미지를 0단계 이미지와 비교하는 데 쓴다.
      # 두 플랫폼의 크기를 각각 남긴다. 스캔이 실패한 실행에서도 크기는 남도록 always()를 쓰되, 두 이미지가 모두 만들어졌을 때만 실행한다.
      # 크기는 docker image inspect가 보고하는 Size다 (0단계 이미지도 같은 명령으로 재면 같은 기준으로 비교된다).
      - name: 실행 요약 남기기
        if: always() && steps.build-amd64.outcome == 'success' && steps.build-arm64.outcome == 'success'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.tags }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          {
            echo '### 이미지'
            echo
            echo "- 이미지: \`${IMAGE_REF}\` (linux/amd64, linux/arm64)"
            for arch in amd64 arm64; do
              size_bytes=$(docker image inspect "scan:${arch}" --format '{{.Size}}')
              size_mb=$(awk -v bytes="$size_bytes" 'BEGIN { printf "%.1f", bytes / 1000000 }')
              echo "- 크기 (linux/${arch}): ${size_mb} MB (${size_bytes} bytes)"
            done
            if [ "$PUSH_OUTCOME" = 'success' ]; then
              echo "- 푸시한 태그: \`${IMAGE_REF}\`"
            else
              echo '- 푸시: 안 함 (PR이거나 앞 단계가 실패했다)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 설정 저장소(GitOps)에 "dev에는 이 이미지를 띄운다"는 원하는 상태를 기록하는 잡이다.
  #
  # GitOps에서 CI는 클러스터에 접속하지 않는다. 클러스터 자격 증명(kubeconfig)도 CI에 두지 않는다.
  # CI가 하는 일은 이미지를 만들어 GHCR에 올리는 것(위 image 잡)과, 설정 저장소의 dev 값 파일에서 image.tag를 그 이미지의 SHA로 바꿔 커밋하는 것(이 잡)까지다.
  # 실제 배포는 클러스터 안에서 도는 Argo CD가 한다. 설정 저장소를 주기적으로 읽어서 클러스터의 실제 상태를 Git에 적힌 상태에 맞춘다(클러스터가 밖에서 가져오는 pull 방식이다).
  # 그래서 "dev에 지금 뭐가 떠 있어야 하나"의 답이 Git 이력(누가, 언제, 어느 앱 커밋으로)에 남고, 되돌리기는 그 설정 커밋을 git revert하는 것이다.
  # 이 상태를 앱 저장소가 아니라 별도 저장소에 두는 이유: 이 저장소의 main은 PR과 필수 검사로 보호돼서 CI가 직접 커밋을 얹기 어렵고,
  # 앱 코드 이력에 배포 커밋이 섞이지 않으며, CI에 주는 쓰기 권한을 설정 저장소 하나로 한정할 수 있다.
  #
  # image 잡에 합치지 않고 잡을 나눈 이유: 설정 저장소에 쓰는 배포 키가 서드파티 액션(Buildx, Trivy 등)과 이미지 빌드가 도는 러너에 있으면 안 되기 때문이다.
  # 잡마다 러너가 따로라서, 이 키는 이 잡의 러너에만 전달되고 image 잡의 러너에는 가지 않는다. 반대로 image 잡의 packages: write 같은 권한도 이 잡에는 없다.
  deploy-dev:
    name: deploy-dev
    # image 잡이 성공해야 돈다. 테스트와 취약점 스캔 게이트를 통과해 GHCR에 올라간 이미지만 배포 상태에 기록된다.
    needs: image
    # image 잡이 이미지를 올리는 조건과 같다. PR 실행에서는 올라간 이미지가 없으니 기록할 상태도 없다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 이 잡이 설정 저장소에 쓰는 힘은 GITHUB_TOKEN이 아니라 아래 배포 키에서 나온다. GITHUB_TOKEN은 이 앱 저장소에서만 유효한데 이 잡은 앱 저장소에 쓰지 않으므로 읽기만 둔다.
    # (잡 단위 permissions는 워크플로 단위 값을 통째로 대체하므로 contents: read를 다시 적는다.)
    permissions:
      contents: read
    # 설정 저장소의 main에는 한 번에 한 잡만 쓴다. 같은 저장소에서 같은 그룹 이름을 쓰는 잡은 동시에 하나만 돈다. 이 그룹은 ref가 아니라 "설정 저장소에 쓰기"를 가리키는 이름이라,
    # 나중에 워크플로 단위 concurrency(위)가 바뀌거나 다른 워크플로가 이 이름을 함께 쓰더라도 직렬화가 유지된다 (지금은 워크플로 단위 그룹도 main의 실행을 이미 하나씩만 돌린다).
    # cancel-in-progress: false: 진행 중인 잡은 끊지 않는다. 푸시 도중에 끊기면 로그만으로는 커밋이 원격에 반영됐는지 알 수 없다.
    # 대기 중인 잡은 더 새 잡이 오면 GitHub가 대체한다. 이 잡은 "지금 원하는 태그" 하나를 덮어쓰는 일이라 옛 SHA를 건너뛰고 최신 SHA로 갱신해도 되고, 이력은 Git 커밋으로 남는다.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      # 설정 저장소와, 그 안에서 CI가 고치는 파일 (설정 저장소의 디렉터리 구조와 짝이다: environments/<환경>/values.yaml)
      CONFIG_REPO: seongj-un/dev-ops-study-config
      VALUES_FILE: environments/dev/values.yaml
      # image 잡이 푸시한 이미지의 태그와 같은 값이다: 이 푸시 커밋의 전체 SHA(40자). 배포 상태가 소스 커밋과 1:1로 이어진다.
      IMAGE_TAG: ${{ github.sha }}
    steps:
      # 시크릿 CONFIG_REPO_DEPLOY_KEY가 비어 있으면(아직 등록 전이거나 이름을 잘못 적으면) actions/checkout은 에러 없이 SSH 대신 이 워크플로의 GITHUB_TOKEN을 쓰는 HTTPS 방식으로 바뀐다.
      # 설정 저장소가 공개라 클론은 성공하고, 푸시 단계에서야 권한 오류(403)로 실패한다. 원인을 찾기 어려우므로 체크아웃 전에 먼저 확인한다.
      # 시크릿 값은 셸에 넘기지 않는다. `secrets.X != ''`는 러너가 계산해서 true/false만 환경 변수로 들어간다.
      - name: 배포 키 시크릿 확인
        env:
          HAS_DEPLOY_KEY: ${{ secrets.CONFIG_REPO_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_DEPLOY_KEY" != 'true' ]; then
            echo '::error::시크릿 CONFIG_REPO_DEPLOY_KEY가 비어 있다. 설정 저장소에 쓰기 권한으로 등록한 배포 키의 비공개 키를 이 저장소의 Actions 시크릿으로 등록한다.'
            exit 1
          fi

      # 이 잡이 체크아웃하는 것은 앱 저장소가 아니라 설정 저장소다. 앱 소스는 필요 없다(이미지는 image 잡이 이미 만들었다).
      - name: 설정 저장소 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CONFIG_REPO }}
          # 푸시할 브랜치를 명시한다. 생략하면 설정 저장소의 기본 브랜치를 알아내서(SSH일 때는 git ls-remote로) 받는다.
          ref: main
          # 설정 저장소에 쓰려면 GITHUB_TOKEN으로는 안 된다. GITHUB_TOKEN은 워크플로가 도는 저장소(이 앱 저장소)에서만 유효하다.
          # 그래서 설정 저장소의 배포 키(deploy key)를 쓴다. SSH 키 한 쌍에서 공개 키는 설정 저장소에 "쓰기 허용"으로 등록하고, 비공개 키는 이 저장소의 시크릿에 둔다.
          # 배포 키는 등록한 저장소 하나에서만 통한다 (GitHub는 같은 공개 키를 다른 저장소나 계정에 다시 등록하지 못하게 막는다).
          # 그래서 이 키가 새어도 열리는 것은 설정 저장소뿐이고, 이 앱 저장소나 계정의 다른 저장소에는 아무 힘이 없다.
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}
          # 다른 잡(test, image)은 persist-credentials: false로 자격을 러너에 남기지 않는다. 이 잡은 남겨야 한다. 뒤 단계에서 git pull과 git push를 하기 때문이다.
          # true(기본값이지만 일부러 적었다)이면 체크아웃이 끝난 뒤에도 $RUNNER_TEMP의 SSH 키 파일과, 그 경로를 적은 저장소의 git 설정(core.sshCommand)이 남는다.
          # 그래서 뒤 단계의 git 명령이 같은 키로 인증된다. false이면 체크아웃이 끝나는 즉시 둘 다 지워서 뒤 단계의 git push가 인증 오류로 실패한다.
          # 남긴 키 파일과 설정은 잡이 끝날 때 액션의 post 단계가 지운다. 이 잡에는 서드파티 액션이 없다.
          # 키가 있는 러너에서 도는 코드는 GitHub의 체크아웃 액션, 러너에 설치된 git·yq, 이 파일의 셸 스크립트뿐이다.
          persist-credentials: true

      # dev 값 파일의 image.tag를 이 커밋의 SHA로 바꾼다.
      # yq(mikefarah, v4)는 ubuntu-24.04 러너 이미지에 설치돼 있어서 별도 액션 없이 쓴다. 배포 키가 있는 잡에 서드파티 액션을 더하지 않는 효과도 있다.
      # 값은 식에 이어 붙이지 않고 환경 변수로 넘겨 strenv()로 읽는다. 셸 인용 문제가 없고 값이 항상 문자열로 쓰인다.
      # SHA가 (극히 드물게) 숫자나 지수 표기로만 보이는 모양이어도 yq가 따옴표를 붙여 문자열로 남기므로, 차트가 요구하는 문자열 40자 16진수가 유지된다.
      #
      # yq는 없는 키를 에러 없이 새로 만든다. 값 파일의 구조가 바뀌어 image.tag가 없는데도 잡이 초록색으로 끝나고 dev만 갱신되지 않는 일을 막으려고 먼저 값을 읽는다.
      # (-e: 키가 없거나 null이면 종료 코드 1로 실패한다.)
      # 이미 같은 태그면 파일을 건드리지 않고 끝낸다. 같은 커밋의 잡을 다시 돌려도 빈 커밋이나 서식만 바뀐 커밋이 생기지 않는다.
      #
      # yq는 파일을 다시 쓴다. 주석은 그대로 두지만 빈 줄을 없애고, 들여쓰기와 줄 끝 주석 앞의 공백을 yq 방식으로 맞춘다.
      # 값 파일이 아직 yq가 쓴 모양이 아니면 첫 커밋에만 서식 변경이 함께 들어가고, 그 뒤로는 태그 한 줄만 바뀐다.
      - name: dev 이미지 태그 갱신 (yq)
        id: bump
        run: |
          set -euo pipefail

          if ! current=$(yq -e '.image.tag' "$VALUES_FILE"); then
            echo "::error::${VALUES_FILE}에서 image.tag를 읽지 못했다 (파일이 없거나, YAML이 깨졌거나, 키가 없다). 설정 저장소의 값 파일 구조를 확인한다."
            exit 1
          fi

          if [ "$current" = "$IMAGE_TAG" ]; then
            echo "dev의 image.tag가 이미 ${IMAGE_TAG}라 커밋하지 않는다."
            {
              echo '### dev 배포 상태 기록'
              echo
              echo "- 변경 없음: \`${VALUES_FILE}\`의 image.tag가 이미 \`${IMAGE_TAG}\`다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          yq -i '.image.tag = strenv(IMAGE_TAG)' "$VALUES_FILE"
          git --no-pager diff
          {
            echo '### dev 배포 상태 기록'
            echo
            echo "- dev 이미지 태그: \`${current}\` → \`${IMAGE_TAG}\` (\`${VALUES_FILE}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      # 봇 이름으로 커밋해서 푸시한다. 이 커밋이 "dev에 이 SHA를 띄운다"는 원하는 상태의 기록이고, Argo CD가 이 커밋을 가져가 클러스터에 반영한다.
      # 설정 저장소의 main은 PR을 요구하는 룰셋으로 보호되는데 이 배포 키가 룰셋의 우회(bypass) 대상이라, PR 없이 바로 푸시할 수 있다. prod는 사람이 PR로 바꾼다.
      # 우회는 룰셋 전체를 건너뛰는 것이라 키 자체는 main의 어느 파일이든 PR 없이 바꿀 수 있다(prod 값 파일도). dev 값 파일의 태그 한 줄만 바꾸는 것은 이 스크립트가 지키는 약속이다.
      #
      # 푸시가 거절될 수 있다. 설정 저장소에는 CI 말고 사람도 쓴다(PR 머지: 차트 수정, prod 승격 등). 우리가 체크아웃한 뒤에 그쪽 main이 앞서 나가면
      # 우리 커밋은 원격 main 위에 있지 않아서(non-fast-forward), git이 남의 커밋을 덮어쓰지 않으려고 푸시를 막는다.
      # 그래서 원격 main을 받아(git pull --rebase) 우리 커밋을 그 위로 다시 얹은 뒤 푸시한다. 최대 3번 시도한다.
      # 두 커밋이 같은 줄(image.tag)을 바꿔서 rebase가 충돌하면 자동으로 풀지 않고 잡을 실패시킨다.
      # 이 잡끼리는 concurrency로 직렬화돼 서로를 거절시키지 않는다. 이 재시도는 사람의 푸시와 겹칠 때를 위한 것이다.
      #
      # 푸시가 끝나면 그 설정 저장소 커밋의 링크를 실행 요약에 남긴다.
      - name: 커밋하고 푸시 (거절되면 rebase 후 재시도)
        if: steps.bump.outputs.changed == 'true'
        env:
          APP_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- "$VALUES_FILE"
          git commit --quiet \
            -m "deploy(dev): shortener ${IMAGE_TAG::7}" \
            -m "앱 커밋: ${APP_COMMIT_URL}
          CI 실행: ${RUN_URL}"
          git --no-pager show --stat --format=fuller HEAD

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::푸시가 3번 모두 실패했다. 위 git 출력의 사유를 확인한다 (룰셋 위반이면 배포 키가 우회 대상인지, 인증 오류면 키에 쓰기 권한이 있는지).'
              exit 1
            fi
            echo "::warning::푸시가 실패했다 (시도 ${attempt}/3). 원격 main이 앞서 나갔을 수 있으니 받아서 그 위로 커밋을 다시 얹고 재시도한다."
            git pull --rebase origin main
          done

          commit_sha=$(git rev-parse HEAD)
          commit_url="${GITHUB_SERVER_URL}/${CONFIG_REPO}/commit/${commit_sha}"
          echo "설정 저장소 커밋: ${commit_url}"
          {
            echo "- 설정 저장소 커밋: [\`${commit_sha::7}\`](${commit_url})"
            if [ "$attempt" -gt 1 ]; then
              echo "- 푸시는 ${attempt}번째 시도에 성공했다 (원격 main이 앞서 있어 rebase 후 재시도했다)."
            fi
            echo '- 클러스터의 Argo CD가 설정 저장소를 읽어 이 커밋을 반영한다. CI는 클러스터에 접속하지 않는다.'
          } >> "$GITHUB_STEP_SUMMARY"
