server:
  # 종료 신호(SIGTERM)를 받으면 새 요청은 받지 않고, 처리 중인 요청을 끝낸 뒤 내려간다.
  # Spring Boot 4.1에서는 이미 기본값이지만, 이 동작에 기대고 있다는 걸 드러내려고 일부러 적어 둔다
  shutdown: graceful

spring:
  application:
    name: shortener
  lifecycle:
    # 종료 단계(SmartLifecycle phase) 하나가 끝나길 기다리는 최대 시간이다 (기본 30초). graceful shutdown에서는 처리 중인 요청을 기다려 주는 시간이 된다.
    # Kubernetes의 기본 종료 유예 시간(terminationGracePeriodSeconds, 30초) 안에 끝나도록 20초로 줄였다.
    # preStop 훅이 도는 시간도 같은 유예 시간에서 빠지므로, 나중에 preStop 지연을 넣을 여유를 남기는 값이기도 하다
    timeout-per-shutdown-phase: 20s
  datasource:
    # 12-Factor: 설정은 환경 변수로 주입한다. 기본값은 로컬 개발용이다 (비밀번호만 예외로 기본값이 없다).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shortener}
    username: ${DB_USERNAME:shortener}
    # 비밀번호만 기본값을 두지 않는다 (콜론 뒤를 비우면 변수가 없을 때 빈 문자열이 된다).
    # 개발용 비밀번호가 기본값으로 남아 있으면, Kubernetes에서 이 변수를 넣는 env 항목을 빠뜨리거나 이름을 잘못 적어도 앱이 아무 경고 없이 그 비밀번호로 접속을 시도한다.
    # DB의 실제 비밀번호가 우연히 같으면 알려진 약한 비밀번호로 조용히 붙어 버리고, 다르면 "비밀번호가 틀렸다"는 오류만 나와서 원인이 env 누락인지 알아보기 어렵다.
    # 기본값이 없으면 비밀번호가 빈 채로 남아서, 비밀번호 인증을 요구하는 DB에 붙을 때 pgjdbc가 "비밀번호가 제공되지 않았다"는 인증 오류를 낸다. 원인이 그대로 드러난다.
    # 시작 단계에서 Flyway가 처음 DB에 붙다가 이 오류를 만난다. 아래 spring.flyway.connect-retries만큼(약 53초) 다시 시도해도 같은 오류라서 그 뒤에 앱이 죽고, 파드는 CrashLoopBackOff가 되어 설정 누락이 배포 직후에 눈에 띈다.
    # compose와 Helm 차트는 항상 DB_PASSWORD를 넘긴다.
    # 콜론 없이 ${DB_PASSWORD}로 적지 않는 이유: 변수가 없을 때 플레이스홀더를 해석하지 못해 죽는데, 그러면 Testcontainers가 접속 정보를 직접 넣어 주는 테스트와 bootTestRun에서도 이 변수를 따로 줘야 한다.
    password: ${DB_PASSWORD:}
    hikari:
      # 요청이 풀에서 커넥션을 받으려고 기다리는 최대 시간이다. 이 시간 안에 못 받으면 예외로 실패한다 (Hikari 기본값은 30초).
      # DB가 느려져 풀의 커넥션(기본 최대 10개)이 모두 쓰이는 중이면, 30초씩 기다리는 요청들이 Tomcat 요청 스레드(기본 최대 200개)를 차례로 붙잡아 앱 전체가 멈춘 것처럼 된다.
      # 3초로 줄여서 오래 기다리게 하지 않고 빨리 실패시킨다.
      # 단위는 밀리초다. Hikari의 이 값은 long이라 3s 같은 Duration 표기를 받지 못하고, 쓰면 바인딩 오류로 앱이 뜨지 않는다.
      connection-timeout: 3000
      # pgjdbc(PostgreSQL JDBC 드라이버)의 연결 속성이다. Hikari가 커넥션을 맺을 때 드라이버에 그대로 넘기고, 단위는 초다.
      # 이름은 대소문자를 구분하고, 틀려도 오류 없이 무시되어 기본값으로 동작한다 (DataSourceSettingsTest가 실제 커넥션에 적용됐는지 확인한다).
      # 접속 URL 뒤에 쿼리스트링으로 붙이지 않고 여기에 두는 이유: 값마다 주석을 달 수 있고, 테스트에서 Testcontainers가 URL을 통째로 바꿔 끼워도 값이 유지된다.
      data-source-properties:
        # TCP 연결을 맺는 데 기다리는 최대 시간이다 (pgjdbc 기본값은 10초). DB가 SYN에 응답하지 않을 때(노드 장애, 방화벽이나 NetworkPolicy가 패킷을 조용히 버릴 때) 5초 만에 시도를 접는다.
        # 연결을 맺은 뒤 서버 응답을 기다리는 시간은 여기에 포함되지 않고 아래 socketTimeout이 맡는다.
        connectTimeout: 5
        # 소켓에서 DB의 응답을 읽으려고 기다리는 최대 시간이다. pgjdbc 기본값은 0이라 제한이 없다.
        # DB가 응답을 안 주는 경우(프로세스 정지, 끝나지 않는 락 대기 등)에는 TCP 연결이 그대로 열려 있고 끊겼다는 신호(FIN·RST)도 오지 않아 읽기가 끝나지 않는다.
        # 그러면 그 요청의 스레드와 풀의 커넥션이 함께 영원히 묶인다. 30초 안에 응답이 없으면 커넥션을 닫고 예외를 낸다.
        # 정상 쿼리 중 가장 오래 걸리는 것보다 커야 한다 (이 앱의 쿼리는 모두 짧다). Flyway 마이그레이션도 같은 DataSource를 쓰므로 문장 하나가 30초를 넘기는 마이그레이션은 이 값에 끊긴다.
        socketTimeout: 30
  flyway:
    # DB에 연결하지 못했을 때 Flyway가 다시 시도하는 횟수다. 기본값은 0이라 첫 실패에서 바로 마이그레이션이 실패하고 앱이 죽는다.
    # EC2에서 처음 부팅했을 때가 그랬다: PostgreSQL이 앱보다 약 4초 늦게 준비돼서 Flyway의 첫 연결이 거부됐고(로그: Connection to shortener-<env>-postgresql:5432 refused), 앱 컨테이너가 한 번 재시작한(RESTARTS 1) 뒤에야 붙었다.
    # 다시 시도하면 앱이 죽지 않고 DB가 뜨기를 최대 약 53초 기다린다. 그보다 늦게 뜨면(예: 새 클러스터에서 PostgreSQL 이미지를 느리게 받을 때) 여전히 앱이 죽고 컨테이너가 재시작한다.
    connect-retries: 7
    # 이름과 달리 재시도 간격이 아니라 간격의 상한이다. 재시도 사이의 대기는 1초에서 시작해 두 배씩 늘어나다가(1, 2, 4, 8, ...) 이 값에서 멈춘다.
    # 그래서 7번의 대기는 1 + 2 + 4 + 8 + 10 + 10 + 10 = 45초다. 여기에 시도마다 Hikari가 풀을 만들다 실패하기까지 걸리는 약 1초가 더해져서,
    # 첫 시도부터 마지막 시도가 실패할 때까지 약 53초 기다린다 (로컬에서 DB 없이 앱을 띄워 쟀다).
    # 기본 상한(120초)을 그대로 두면 뒤쪽 대기가 16초, 32초로 늘어나서 DB가 이미 떴는데도 한참 더 기다린다. 10초로 막으면 DB가 뜬 뒤 길어야 10초쯤 뒤에 붙는다.
    # startupProbe(설정 저장소 차트의 deployment.yaml)는 2초마다 검사해서 60번 연속 실패하면, 곧 120초 안에 통과하지 못하면 컨테이너를 재시작한다.
    # 앱이 뜨는 동안에는 management 포트가 아직 열리지 않아서 연결이 바로 거부되고, 그 검사는 실패로 센다. 그래서 재시도 시간에 JVM·컨텍스트 기동 시간을 더한 값이
    # 120초 안에 들어와야 Flyway가 기다리는 도중에 컨테이너가 재시작되지 않는다. 횟수나 상한을 늘릴 때는 이 합을 같이 본다.
    # DB가 연결을 거부하지 않고 응답이 없으면(패킷이 버려질 때) 시도마다 위 connectTimeout(5초)이 더 든다.
    # 연결이 안 되는 이유는 가리지 않고 다시 시도한다 (즉시 실패하는 것은 SQL Server 전용 오류 몇 가지뿐이다). 그래서 DB_PASSWORD가 틀리거나 비어 있어도 이 시간이 지난 뒤에야 앱이 죽는다.
    connect-retries-interval: 10s
  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션이 만들고 바꾼다. Hibernate는 테이블을 고치지 않고, 시작할 때 엔티티와 테이블이 맞는지 검사만 한다.
      # 어긋나면(컬럼 이름·타입 불일치 등) 첫 쿼리가 아니라 앱 시작 시점에 바로 실패한다
      ddl-auto: validate
    # 요청이 끝날 때까지 DB 커넥션을 붙잡지 않도록 끈다.
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # timeout은 명령 하나가 응답을 기다리는 최대 시간이다. Lettuce 기본값은 60초라서, Redis가 응답 없이 멈추면 요청 스레드가 그동안 묶인다.
      # 500ms로 줄여도 최악의 경우는 남는다: 리다이렉트 한 번이 Redis를 두 번 부르기 때문이다 (조회 get, 그리고 캐시에 없을 때의 저장 put).
      # get이 실패하면 캐시 미스와 똑같이 DB에서 읽은 뒤 put을 또 부르므로, Redis가 응답하지 않으면 get이 타임아웃 난 다음 put도 타임아웃까지 기다린다.
      # 그래서 리다이렉트마다 최대 약 1초(500ms × 2)가 더 걸린다. 이미 맺은 연결이 끊긴 경우(Redis 프로세스 종료 등)도 마찬가지다:
      # Lettuce는 기본으로 자동 재연결을 하면서 그동안 들어온 명령을 쌓아 두므로, 명령은 재연결되거나 타임아웃 날 때까지 기다린다.
      # 새로 연결을 맺다가 거절당하는 경우(앱이 뜰 때 Redis가 없는 경우 등)만 즉시 실패한다.
      # 5단계(장애 훈련)에서 이 지연을 측정하고, get이 실패하면 put을 건너뛰거나 서킷 브레이커를 두는 식으로 줄인다
      timeout: 500ms
      # 연결을 맺는 데 기다리는 최대 시간
      connect-timeout: 500ms
  mvc:
    problemdetails:
      # Spring MVC가 직접 던지는 예외(잘못된 요청 본문 등)와 ErrorResponseException 하위 클래스(우리 코드의 400/404)를 RFC 9457 형식(application/problem+json)으로 바꿔 준다.
      # 처리하지 못한 예외(DB 장애, 코드 생성 재시도 소진 등)는 여기에 해당하지 않아서 /error를 거쳐 Boot 기본 에러 JSON(timestamp, status, error, path)의 500이 된다
      enabled: true

logging:
  structured:
    format:
      # 콘솔 로그를 한 줄짜리 JSON(ECS 형식)으로 찍는다. 로그 수집기(Alloy → Loki)가 필드 단위로 검색할 수 있다
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      # Spring Boot 4는 기본값이 true지만, Kubernetes 프로브가 /actuator/health/liveness, /readiness 경로에 의존하므로 명시해서 남긴다
      probes:
        enabled: true
      show-components: always
      group:
        # readiness: DB가 살아 있어야 트래픽을 받는다. Redis는 죽어도 DB로 버틸 수 있으니 넣지 않는다
        readiness:
          include: readinessState, db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # p50/p95/p99 지연시간을 Prometheus에서 계산할 수 있게 히스토그램 버킷을 내보낸다
      percentiles-histogram:
        http.server.requests: true
      # 지연 SLO("요청의 99%가 300ms 이하")의 좋은 요청 수를 정확히 세려고 버킷 경계를 직접 정한다. 위 percentiles-histogram의 버킷에 더해지는 것이고, 그것을 대신하지 않는다.
      # 기본 버킷에는 0.3초 경계가 없다 (가장 가까운 것이 0.268초와 0.358초). 히스토그램은 "경계 이하인 요청 수"만 세어 두므로, 경계가 없으면 300ms 이하의 수를 구할 수 없고 가까운 버킷으로 어림해야 한다.
      # 300ms가 SLO 기준이고 100ms와 1s는 그 앞뒤의 보조 경계다. SLO 규칙(설정 저장소 차트)이 le="0.3" 버킷으로 좋은 요청을 세므로, SLO의 임계값을 바꾸면 이 경계도 함께 바꾼다.
      # 단위를 붙여 적으면 Duration으로 읽는다. Prometheus 출력은 초 단위라서 le="0.1", le="0.3", le="1.0"이 된다 (OpsEndpointsTest가 확인한다).
      slo:
        http.server.requests: 100ms, 300ms, 1s

shortener:
  base-url: ${SHORTENER_BASE_URL:http://localhost:8080}
  cache-ttl: ${SHORTENER_CACHE_TTL:24h}
  fault:
    # 훈련용 장애 주입 스위치다. 앱 포트로 들어온 요청 중 이 비율(0.0~1.0)만큼은 컨트롤러까지 가지 않고 HTTP 500을 돌려받는다. 0.0이면 꺼진 것이고, 이때는 필터가 요청 경로에 들어가지도 않는다.
    # 카나리 분석의 자동 롤백과 SLO 알림 훈련에서 "나쁜 버전"을 흉내 내려고, 설정 저장소가 이 값을 올린 배포를 만든다. 평소 운영에서는 켜지 않는다.
    # 범위를 벗어난 값(음수, 1 초과)이면 앱이 시작 단계에서 죽는다. 훈련 중에 값을 잘못 적어 의도와 다르게 동작하는 일이 없게 하려는 것이다.
    # management 포트(/actuator)의 요청은 대상이 아니다. 프로브까지 실패하면 쿠버네티스가 파드를 재시작해서, 5xx 비율을 보려던 분석에 데이터가 남지 않는다.
    error-rate: ${SHORTENER_FAULT_ERROR_RATE:0.0}
