server:
  # 종료 신호(SIGTERM)를 받으면 새 요청은 받지 않고, 처리 중인 요청을 끝낸 뒤 내려간다
  shutdown: graceful

spring:
  application:
    name: shortener
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # 12-Factor: 설정은 환경 변수로 주입한다. 기본값은 로컬 개발용이다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shortener}
    username: ${DB_USERNAME:shortener}
    password: ${DB_PASSWORD:shortener}
  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션이 관리한다. Hibernate는 테이블을 만들거나 고치지 않는다.
      ddl-auto: none
    # 요청이 끝날 때까지 DB 커넥션을 붙잡지 않도록 끈다.
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis가 죽었을 때 요청이 오래 멈추지 않게 짧게 둔다 (Lettuce 기본 명령 타임아웃은 60초)
      timeout: 500ms
      connect-timeout: 500ms
  mvc:
    problemdetails:
      # 에러 응답을 RFC 9457 형식(application/problem+json)으로 통일한다
      enabled: true

logging:
  structured:
    format:
      # 콘솔 로그를 한 줄짜리 JSON(ECS 형식)으로 찍는다. 로그 수집기(Alloy → Loki)가 필드 단위로 검색할 수 있다
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      # Spring Boot 4는 기본값이 true지만, Kubernetes 프로브가 /actuator/health/liveness, /readiness 경로에 의존하므로 명시해서 남긴다
      probes:
        enabled: true
      show-components: always
      group:
        # readiness: DB가 살아 있어야 트래픽을 받는다. Redis는 죽어도 DB로 버틸 수 있으니 넣지 않는다
        readiness:
          include: readinessState, db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # p50/p95/p99 지연시간을 Prometheus에서 계산할 수 있게 히스토그램 버킷을 내보낸다
      percentiles-histogram:
        http.server.requests: true

shortener:
  base-url: ${SHORTENER_BASE_URL:http://localhost:8080}
  cache-ttl: ${SHORTENER_CACHE_TTL:24h}
